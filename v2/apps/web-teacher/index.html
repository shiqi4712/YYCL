<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>异议处理训练仓</title>
    <link rel="stylesheet" href="/assets/teacher/styles.css?v=20260809-training-chat" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-glow page-glow-a"></div>
      <div class="page-glow page-glow-b"></div>

      <main class="teacher-app">
        <section class="auth-screen shell-card" id="teacherAuthScreen">
          <div class="auth-copy">
            <p class="eyebrow">YYCL Teacher</p>
            <h1>异议处理训练仓</h1>
          </div>

          <form class="auth-card" id="teacherLoginForm" autocomplete="off">
            <h2>账号登录</h2>
            <label>
              <span>账号</span>
              <input name="username" placeholder="请输入账号" autocomplete="off" autocapitalize="none" spellcheck="false" />
            </label>
            <label>
              <span>密码</span>
              <input name="password" type="password" placeholder="请输入密码" autocomplete="new-password" />
            </label>
            <button class="primary-btn" type="submit">登录</button>
            <p class="status-text" id="teacherLoginStatus"></p>
          </form>
        </section>

        <section class="workspace hidden" id="teacherWorkspace">
          <header class="topbar glass-bar">
            <div>
              <p class="eyebrow">Teacher Console</p>
              <h1 id="teacherHeaderTitle">功能首页</h1>
            </div>
            <div class="topbar-actions">
              <div class="profile-chip" id="teacherProfileChip"></div>
              <button class="secondary-btn hidden" id="teacherBackButton" type="button">返回</button>
              <button class="secondary-btn" id="teacherRefreshButton" type="button">刷新</button>
              <button class="secondary-btn" id="teacherLogoutButton" type="button">退出登录</button>
            </div>
          </header>

          <section class="hero-card shell-card" id="teacherHero">
            <p class="eyebrow">Objection Copilot</p>
            <h2>异议处理管家</h2>
            <p>老师登录后可进入异议处理仓库查询解决思路和话术，也可以进入异议处理训练模块进行后续练习。</p>
          </section>

          <section class="portal-grid" id="portalView">
            <button class="portal-card" type="button" data-entry="repository">
              <div class="portal-icon">仓</div>
              <p class="eyebrow">Repository</p>
              <h2>异议处理仓库</h2>
              <p>按课前进线、课中推进、结转促单查询家长常见异议、解决思路和可参考话术。</p>
              <div class="tag-row">
                <span class="tag">话术搜索</span>
                <span class="tag-good">思路拆解</span>
                <span class="tag-warn">禁忌提醒</span>
              </div>
            </button>

            <button class="portal-card" type="button" data-entry="training">
              <div class="portal-icon">练</div>
              <p class="eyebrow">Training</p>
              <h2>异议处理训练</h2>
              <p>进入模拟训练入口。后续可按场景生成家长异议，老师多轮回复后生成结构化复盘。</p>
              <div class="tag-row">
                <span class="tag">模拟家长</span>
                <span class="tag-good">多轮练习</span>
                <span class="tag-warn">训练复盘</span>
              </div>
            </button>
          </section>

          <section class="scene-home hidden" id="repositoryHomeView">
            <article class="shell-card section-card">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Scenario</p>
                  <h2>选择场景</h2>
                </div>
                <span class="tag">先选场景</span>
              </div>
              <div class="scene-grid" id="teacherSceneList"></div>
            </article>
          </section>

          <section class="repository-detail hidden" id="repositoryDetailView">
            <section class="shell-card section-card">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Search</p>
                  <h2 id="teacherObjectionTitle">异议问题</h2>
                </div>
                <div class="inline-actions">
                  <span class="tag" id="teacherResultCount">0 条</span>
                  <button class="secondary-btn compact-btn" id="teacherBackToScenesButton" type="button">返回场景</button>
                </div>
              </div>
              <input id="teacherSearchInput" placeholder="搜索异议、家长顾虑、关键词，例如：没时间 / 价格 / 孩子坐不住" />
              <div class="objection-list" id="teacherObjectionList"></div>
            </section>

            <section class="shell-card section-card">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Playbook</p>
                  <h2>解决思路与话术</h2>
                </div>
              </div>
              <div class="detail-panel" id="teacherDetailPanel"></div>
            </section>
          </section>

          <section class="training-view hidden" id="trainingView">
            <article class="shell-card section-card" id="trainingPicker">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Training</p>
                  <h2>选择训练场景</h2>
                </div>
                <span class="tag-warn">先选场景，再进入对话</span>
              </div>
              <div class="training-scenario-grid" id="trainingScenarioList"></div>
              <p class="status-text" id="trainingLoadStatus"></p>
            </article>

            <section class="training-chat hidden" id="trainingChat">
              <aside class="shell-card section-card training-context">
                <div class="section-head">
                  <div>
                    <p class="eyebrow">Context</p>
                    <h2 id="trainingScenarioTitle">训练场景</h2>
                  </div>
                  <button class="secondary-btn compact-btn" id="trainingBackButton" type="button">重新选场景</button>
                </div>
                <div class="context-list" id="trainingContextList"></div>
                <button class="secondary-btn" id="trainingEndButton" type="button">结束训练并生成复盘</button>
              </aside>

              <article class="shell-card section-card training-dialog">
                <div class="section-head">
                  <div>
                    <p class="eyebrow">Parent Chat</p>
                    <h2>模拟家长对话</h2>
                  </div>
                  <span class="tag" id="trainingStatusChip">训练中</span>
                </div>
                <div class="message-list" id="trainingMessageList"></div>
                <div class="reply-wait hidden" id="trainingReplyWait"></div>
                <form class="chat-composer" id="trainingMessageForm">
                  <textarea
                    id="trainingMessageInput"
                    rows="4"
                    placeholder="输入老师回复。Enter 发送，Shift + Enter 换行；如需发送物料，可写 +物料 / +案例 / +图片 / +链接。"
                  ></textarea>
                  <div class="composer-actions">
                    <button class="secondary-btn" id="trainingForceReplyButton" type="button">我说完了，让家长回复</button>
                    <button class="primary-btn" type="submit">发送</button>
                  </div>
                  <button class="primary-btn submit-training-btn" id="trainingSubmitButton" type="button">
                    完成训练提交
                  </button>
                </form>
              </article>

              <aside class="shell-card section-card training-review hidden" id="trainingReviewPanel">
                <div class="section-head">
                  <div>
                    <p class="eyebrow">Review</p>
                    <h2>结构化复盘</h2>
                  </div>
                  <span class="tag-good" id="trainingReviewScore">提升建议</span>
                </div>
                <div id="trainingReviewContent"></div>
              </aside>
            </section>
          </section>
        </section>
      </main>
    </div>

    <script src="/assets/teacher/app.js?v=20260809-training-chat"></script>
  </body>
</html>
